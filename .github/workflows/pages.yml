name: Pages
# The browser demo (web/) at https://<owner>.github.io/cleanplate/
on:
  push:
    branches: [main]
    paths: ["web/**", "LICENSE-THIRD-PARTY.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp LICENSE LICENSE-THIRD-PARTY.md web/   # the page ships third-party code: its notices go with it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

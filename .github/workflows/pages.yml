name: Pages
# The page lives at https://cleanplate.dieplai.io.vn (deploy/). The old GitHub Pages address only redirects there,
# so links shared before 2.0.0 keep working.
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Cleanplate has moved</title>
          <link rel="canonical" href="https://cleanplate.dieplai.io.vn/">
          <meta http-equiv="refresh" content="0; url=https://cleanplate.dieplai.io.vn/">
          <p>Cleanplate has moved to <a href="https://cleanplate.dieplai.io.vn/">cleanplate.dieplai.io.vn</a>.</p>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

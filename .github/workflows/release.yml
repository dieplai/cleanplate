name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: cleanplate }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: cleanplate }
          - { os: macos-13, target: x86_64-apple-darwin, bin: cleanplate }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: cleanplate.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p cleanplate --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist && cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp LICENSE README.md dist/
          cd dist && tar czf ../cleanplate-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
      - uses: softprops/action-gh-release@v2
        with:
          files: cleanplate-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

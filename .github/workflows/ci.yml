name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless
      - run: python -m py_compile research/*.py
      - run: python tests/test_image.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1-threads
      - run: cargo build --release -p cleanplate-wasm --target wasm32-unknown-unknown
      - run: cargo build --release -p cleanplate-wasm --features parallel --target wasm32-wasip1-threads
        env:
          RUSTFLAGS: -C link-arg=--max-memory=4294967296 -C link-arg=--export=__wasi_init_tp -C link-arg=--export=__wasm_call_ctors
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: cargo test --all

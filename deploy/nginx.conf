# /etc/nginx/sites-available/cleanplate.dieplai.io.vn — static page + the service on 127.0.0.1:8095
server {
    listen 80;
    listen [::]:80;
    server_name cleanplate.dieplai.io.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleanplate.dieplai.io.vn;

    ssl_certificate /etc/letsencrypt/live/cleanplate.dieplai.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleanplate.dieplai.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/cleanplate.access.log;
    error_log  /var/log/nginx/cleanplate.error.log;

    root /var/www/cleanplate;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ~* \.wasm$ { default_type application/wasm; add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|html)$ { add_header Cache-Control "no-cache"; }
}

# /etc/nginx/sites-available/cleanplate.dieplai.io.vn — static page + the service on 127.0.0.1:8095

# Fair use of the cleaning service: per client address, 6 files a minute (bursts of 3) and 2 at a time. The address is
# the real client: behind Cloudflare it comes from conf.d/cloudflare-realip.conf (set_real_ip_from + CF-Connecting-IP).
limit_req_zone $binary_remote_addr zone=cleanplate_api:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=cleanplate_conn:10m;
# feedback form: 10 messages a minute per address (bursts of 5)
limit_req_zone $binary_remote_addr zone=cleanplate_fb:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name cleanplate.dieplai.io.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cleanplate.dieplai.io.vn;

    ssl_certificate /etc/letsencrypt/live/cleanplate.dieplai.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleanplate.dieplai.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    # cross-origin isolation: lets the page use SharedArrayBuffer, i.e. the multi-threaded build
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    access_log /var/log/nginx/cleanplate.access.log;
    error_log  /var/log/nginx/cleanplate.error.log;

    root /var/www/cleanplate;
    index index.html;

    location = /api/clean {
        limit_req zone=cleanplate_api burst=3 nodelay;
        limit_conn cleanplate_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_set_header X-Cleanplate-Admin "";
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /api/feedback {
        limit_req zone=cleanplate_fb burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header X-Cleanplate-Admin "";
    }
    # the feedback dashboard and its API: password from `htpasswd -c /etc/nginx/cleanplate-admin.htpasswd admin`
    location ^~ /api/admin/ {
        auth_basic "Cleanplate admin";
        auth_basic_user_file /etc/nginx/cleanplate-admin.htpasswd;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header X-Cleanplate-Admin 1;
    }
    # ^~ so the regex locations below (.html, .js) cannot serve these files without the password
    location ^~ /admin/ {
        auth_basic "Cleanplate admin";
        auth_basic_user_file /etc/nginx/cleanplate-admin.htpasswd;
        alias /var/www/cleanplate-admin/;
        add_header X-Robots-Tag "noindex" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    location /api/ {
        proxy_set_header X-Cleanplate-Admin "";
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # revalidate code on every load (expires, not add_header: a location-level add_header drops the ones above)
    location ~* \.wasm$ { default_type application/wasm; expires -1; }
    location ~* \.(js|css|html)$ { expires -1; }
}

[package]
name = "cleanplate-core"
version = "1.0.0"
description = "Pure-compute core of cleanplate: remove visible generator marks from video and stills"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
png = "0.17"
rustfft = "6"

[dev-dependencies]
npyz = "0.8"

[package]
name = "cleanplate"
version = "0.1.0"
description = "Remove visible generator marks (Veo, Gemini) from video and stills, leaving a clean plate"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cleanplate_cli"
path = "src/lib.rs"

[[bin]]
name = "cleanplate"
path = "src/main.rs"

[dependencies]
cleanplate-core = { path = "../cleanplate-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1"

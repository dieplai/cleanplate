[package]
name = "cleanplate-wasm"
version = "0.1.0"
description = "WebAssembly build of the cleanplate still remover for the browser demo (web/)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# multi-threaded build (wasm32-wasip1-threads + a browser thread shim, see web/wasi-threads.js)
parallel = ["cleanplate-core/parallel", "dep:rayon"]

[dependencies]
cleanplate-core = { path = "../cleanplate-core", default-features = false }
rayon = { version = "1", optional = true }
